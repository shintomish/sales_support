  # access_log にレスポンス時間を含めるカスタムフォーマット
  # rt = $request_time（クライアント受領〜レスポンス完全送出の合計秒）
  # urt = $upstream_response_time（PHP-FPM 等 upstream の応答時間）
  log_format combined_with_time '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time urt=$upstream_response_time';

  server {
      listen 80;
      index index.php index.html;
      error_log  /var/log/nginx/error.log;
      access_log /var/log/nginx/access.log combined_with_time;
      root /var/www/public;

      client_max_body_size 20M;

      proxy_read_timeout 300;
      proxy_connect_timeout 300;
      proxy_send_timeout 300;
      fastcgi_read_timeout 300;

      location / {
          try_files $uri $uri/ /index.php?$query_string;
          gzip_static on;
      }

      location ~ \.php$ {
          try_files $uri =404;
          fastcgi_split_path_info ^(.+\.php)(/.+)$;
          fastcgi_pass app:9000;
          fastcgi_index index.php;
          include fastcgi_params;
          fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
          fastcgi_param PATH_INFO $fastcgi_path_info;
      }
  }
