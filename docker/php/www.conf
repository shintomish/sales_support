; ============================================================================
; PHP-FPM pool 設定 (override)
;
; PHP 公式イメージ (php:8.2-fpm-bookworm) の既定 www.conf を上書きするため、
; /usr/local/etc/php-fpm.d/zzz-www.conf として bind mount される。
; PHP-FPM は同ディレクトリの *.conf を alphabetical 順に読み込むため、
; "zzz-" prefix で既定 www.conf より後にロードされ、同名キーが上書きされる。
;
; 既定値からの主な変更点:
;   - pm.max_children: 5 -> 30  (本番 同時リクエスト捌き量 拡張)
;   - pm.start_servers: 2 -> 8
;   - pm.min_spare_servers: 1 -> 4
;   - pm.max_spare_servers: 3 -> 16
;   - pm.max_requests: 0 -> 500  (worker のメモリリーク対策で定期再生成)
;   - request_terminate_timeout: 0 -> 300s (rescore-all 等の長尺処理に整合)
;
; メモリ見積もり: 30 worker x ~80MB = ~2.4GB ピーク
; ============================================================================

[www]
pm = dynamic
pm.max_children = 30
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 500

request_terminate_timeout = 300s
